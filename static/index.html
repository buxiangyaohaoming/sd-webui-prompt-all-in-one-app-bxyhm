    <div id="tab_search" class="tabitem" style="display:none;">
        <div class="ts-container">
            <!-- Search Mode Tabs -->
            <div class="search-mode-tabs">
                <button class="search-mode-btn active" data-mode="tag">🏷️ 标签</button>
                <button class="search-mode-btn" data-mode="character">👤 角色搜索</button>
            </div>

            <!-- Settings Row -->
            <div class="search-settings" id="search-settings">
                <label class="ts-toggle-label">
                    <input type="checkbox" id="underscore-toggle">
                    <span class="ts-toggle-slider"></span>
                    <span class="ts-toggle-text">_ → 空格</span>
                </label>
                <label class="ts-toggle-label">
                    <input type="checkbox" id="comma-space-toggle">
                    <span class="ts-toggle-slider"></span>
                    <span class="ts-toggle-text">逗号空格</span>
                </label>
                <span class="ts-header-btns">
                    <button class="ts-header-btn" onclick="exportPrompt()" title="导出当前提示词为txt文件">📥 导出</button>
                    <button class="ts-header-btn" onclick="saveTemplate();return false;" title="保存当前提示词为模板">💾 模板</button>
                    <button class="ts-header-btn" onclick="var el=document.getElementById('ts-template-bar');el.style.display=el.style.display==='none'?'block':'none';renderTemplateList();return false;" title="管理模板">📂 模板库</button>
                </span>
            </div>

                <div id="ts-template-list" class="ts-tpl-list"></div>
            </div>

                </div>

                </div>
                <div class="ts-search-input-wrap" id="search-input-wrap-feature" style="display:none;">

                    <div class="tc-field">
                        <label class="tc-label">标签列表 <small>（每行一个标签，或用逗号分隔）</small></label>

blush, smile, looking_at_viewer
...逐行添加标签" rows="5"></textarea>
                    </div>
                    <div class="tc-create-actions">
                        <button id="combo-save-btn" class="tc-btn tc-btn-primary">💾 保存组合</button>
                        <button id="combo-clear-btn" class="tc-btn tc-btn-secondary">🗑️ 清空</button>
                    </div>
                </div>
            </div>

            <!-- Import from prompt -->
            <div class="tc-import-row">
                <button id="combo-import-btn" class="tc-btn tc-btn-outline">📥 从正向提示词导入</button>
                <span class="tc-import-hint">读取当前 txt2img 提示词中的标签</span>
            </div>
            <div class="tc-import-row" style="margin-top:8px;">
                <button id="combo-seed-presets-btn" class="tc-btn tc-btn-outline">📦 导入推荐预设</button>
                <span class="tc-import-hint">添加约 50 个常用标签组合</span>
                <span style="margin-left:auto;"></span>
                <button id="combo-reset-presets-btn" class="tc-btn tc-btn-danger tc-btn-sm">🔄 重置为预设</button>
            </div>

            <!-- Saved Combos -->
            <div class="tc-saved-header">
                <span class="tc-saved-title">📋 已保存的组合</span>
                <span class="tc-saved-count" id="combo-count">0 个</span>
            </div>
            <div id="combo-list" class="tc-combo-list">
                <div class="tc-empty">还没有保存的组合，上方新建一个吧 👆</div>
            </div>

            <!-- Toast -->

        </div>

<script>
    const APP_MODE = true
    let UiLoaded = []
    let embeddings = []
    let loras = []
    let opts = {}

    function selectCheckpoint(name) {
        var time = Math.floor(Math.random() * 2000 + 3000)
        setTimeout(function() {
            opts.sd_model_checkpoint = name
        }, time)
    }

    function onUiLoaded(callback) {
        UiLoaded.push(callback)
    }

    window.onload = function() {
        UiLoaded.forEach(function(callback) {
            callback()
        })
    }
</script>
